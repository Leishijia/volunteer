<text x="770" y="689" font-size="9.5" fill="#7C8FA0">证据：INT-02-02 / INT-02-05 / INT-02-06</text>
<text x="60" y="932" font-size="11" fill="#8FA089">四象限：重点管理＝既要他们的判断也要他们的时间　保持满意＝平时不关心、卡住就动不了　保持知情＝左右不了决定但会被改变工作方式　观察＝本阶段不投入沟通成本</text>
